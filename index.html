<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF3EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>睡眠好物对比</title>
<style>
*{box-sizing:border-box;margin:0}
html{scroll-snap-type:y mandatory;overflow-y:scroll;background:#111}
body{font-family:system-ui,"Noto Sans SC",sans-serif;color:#1a1626;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[lang=ko]{font-family:system-ui,"Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
section{height:100svh;scroll-snap-align:start;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 66px) 22px 22px}
.tabs{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;font:inherit;font-size:17px;font-weight:800;padding:8px 16px;border-radius:99px;background:transparent;color:#6b6475;white-space:nowrap}
.tabs button.on{background:#1a1626;color:#fff}
.tabs small{font-size:11px;font-weight:700;opacity:.65;margin-left:4px}

.cover{background:#FFF3EC}
.kick{font-size:14px;font-weight:800;color:#FF2D55;letter-spacing:.1em}
.cover h1{font-size:clamp(40px,14vw,54px);line-height:1.08;font-weight:900;margin-top:10px;letter-spacing:-.02em}
.cover h1 em{font-style:normal;background:linear-gradient(transparent 58%,#FFD84D 58%)}
.choose{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.choose a{display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 14px}
.choose b{display:block;font-size:clamp(17px,5.6vw,23px);font-weight:900;white-space:nowrap}
.choose small{display:block;font-size:clamp(13px,3.8vw,15px);font-weight:800;opacity:.7;margin-top:2px;white-space:nowrap}
.choose img{flex:none;width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.fan{position:relative;flex:1;min-height:120px}
.fan img{position:absolute;filter:drop-shadow(0 16px 22px rgba(40,20,60,.28))}
.fan .f1{height:96%;left:6%;bottom:0;transform:rotate(-10deg)}
.fan .f2{height:74%;left:36%;bottom:8%;transform:rotate(4deg)}
.fan .f3{width:50%;right:0;bottom:0;transform:rotate(9deg)}
.swipe{text-align:center;font-size:15px;font-weight:800;color:#8a8296;padding-top:8px;animation:up 1.6s ease-in-out infinite}
@keyframes up{50%{transform:translateY(-8px)}}

.p .q{font-size:17px;font-weight:800;opacity:.6}
.bub{margin-top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bub div{background:#fff;border-radius:20px 20px 20px 6px;padding:10px 15px;white-space:nowrap;font-size:clamp(18px,6vw,23px);font-weight:900;line-height:1.25;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bub div::before{content:"✓ ";color:var(--c)}
.go{margin-top:12px;font-size:20px;font-weight:900;color:var(--c)}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;margin:4px 0}
.stage img{max-width:70%;max-height:94%;filter:drop-shadow(0 22px 28px rgba(0,0,0,.3));transform:rotate(-4deg)}
.sticker{position:absolute;right:0;top:6%;background:#FF2D55;color:#fff;font-weight:900;font-size:19px;padding:10px 14px;border-radius:999px;transform:rotate(10deg);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.nm{font-size:34px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.line{font-size:19px;font-weight:700;margin-top:6px;line-height:1.4;opacity:.85}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px}
.price b{font-size:38px;font-weight:900;letter-spacing:-.02em}
.price span{display:block;font-size:16px;font-weight:700;opacity:.7}
.type{font-size:14px;font-weight:800;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.75);white-space:nowrap}
.note{font-size:12px;opacity:.55;margin-top:6px}
.purple{background:#E9E4FF;color:#2A1F78;--c:#5B4BDB}.green{background:#DDF3E8;color:#0B4A38;--c:#12936F}.amber{background:#FFEBC8;color:#5C3300;--c:#D9860F}.pink{background:#FFE3EC;color:#6E1232;--c:#E0386E}.blue{background:#DFEEFF;color:#0D3466;--c:#2F7BE0}
.dots{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:9}
.dots i{width:6px;height:6px;border-radius:9px;background:rgba(0,0,0,.22);transition:.25s}
.dots i.on{height:22px;background:#FF2D55}

.sum{background:#1a1626;color:#fff}
.sum h2{font-size:40px;font-weight:900;line-height:1.15;margin-top:8px}
.rows{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.r{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:22px;padding:14px}
.r img{width:52px;height:52px;object-fit:contain;flex:none}
.r .s{font-size:clamp(17px,5.4vw,21px);font-weight:900;line-height:1.3;white-space:nowrap}
.r .to{white-space:nowrap;font-size:clamp(13px,4.2vw,16px);font-weight:800;margin-top:4px;color:var(--c)}
.sum .r.purple{--c:#A99DFF}.sum .r.green{--c:#5FD3AE}.sum .r.amber{--c:#FFC15A}.sum .r.pink{--c:#FF8FB1}.sum .r.blue{--c:#7DB6FF}
.sum .r{background:rgba(255,255,255,.08);color:#fff}
</style>
</head>
<body>
<nav class="tabs" id="tabs"></nav>
<div class="dots" id="dots"></div>
<main id="app"></main>
<script src="data.js"></script>
<script>
const C = { purple: 'purple', teal: 'green', amber: 'amber', pink: 'pink', blue: 'blue' };
const cny = n => Math.round(n / RATE), won = n => '₩' + n.toLocaleString();
const FAN = ['f1', 'f2', 'f3'];
let io;

function render(id) {
  const cat = CATEGORIES.find(c => c.id === id) || CATEGORIES[0], ps = cat.products;
  document.getElementById('tabs').innerHTML = CATEGORIES.map(c =>
    `<button class="${c === cat ? 'on' : ''}" onclick="go('${c.id}')">${c.zh}<small lang="ko">${c.ko}</small></button>`).join('');
  document.title = cat.zh + ' · 韩国药店';

  let h = `<section class="cover"><div class="kick">${cat.kick}</div><h1>${cat.title}</h1>
    <div class="choose">${ps.map(p => `<a class="${C[p.color]}" onclick="jump('${p.id}')"><img src="${p.cut}" alt=""><div><b>${p.tag}</b><small lang="ko">→ ${p.nameKo}</small></div></a>`).join('')}</div>
    <div class="fan">${ps.slice(0, 3).map((p, i) => `<img class="${FAN[i]}" src="${p.cut}" alt="">`).join('')}</div>
    <div class="swipe">↑ 上滑看看</div></section>`;

  h += ps.map(p => `<section class="p ${C[p.color]}" id="${p.id}">
    <div class="q">你是不是…</div>
    <div class="bub">${p.symptoms.map(s => `<div>${s}</div>`).join('')}</div>
    <div class="go">↓ 选它就对了</div>
    <div class="stage"><img src="${p.cut}" alt=""><div class="sticker">${p.key}</div></div>
    <div class="nm" lang="ko">${p.nameKo}</div>
    <div class="line">${p.line}</div>
    <div class="bar"><div class="price"><b>${won(p.price)}</b><span>≈ ¥${cny(p.price)} · ${p.unit}</span></div><div class="type">${p.typeZh}</div></div>
    <div class="note">${p.caution.join(' · ')}</div></section>`).join('');

  h += `<section class="sum"><div class="kick" style="color:#FF5C7A">一张看懂</div><h2>你是哪一种？</h2>
    <div class="rows">${ps.map(p => `<a class="r ${C[p.color]}" onclick="jump('${p.id}')"><img src="${p.cut}" alt="">
      <div><div class="s">${p.tag}</div><div class="to"><span lang="ko">→ ${p.nameKo}</span> · ${won(p.price)}</div></div></a>`).join('')}</div></section>`;

  document.getElementById('app').innerHTML = h;
  scrollTo(0, 0);
  document.querySelector('.tabs .on').scrollIntoView({ inline: 'center', block: 'nearest' });
  const secs = [...document.querySelectorAll('section')], dots = document.getElementById('dots');
  dots.innerHTML = secs.map(() => '<i></i>').join('');
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) [...dots.children].forEach((d, i) => d.classList.toggle('on', secs[i] === e.target)); }), { threshold: .6 });
  secs.forEach(s => io.observe(s));
}
function go(id) { location.hash = id; }
function jump(id) { document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); }
addEventListener('hashchange', () => render(location.hash.slice(1)));
render(location.hash.slice(1));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
