<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E1B3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>睡眠好物对比</title>
<style>
:root{--bg:#F4F2EC;--card:#fff;--ink:#1C1B22;--sub:#6B6873;--line:#E4E1DA;--night:#1E1B3A;
--purple:#4B3FB8;--teal:#0E7A5E;--teal-bg:#DCF2EA;--teal-ink:#064534;--amber:#B86E0C;
--red-bg:#FBE6E6;--red:#8E2323;--gray-bg:#EDEBE4;--gray:#4A4944}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans SC","Noto Sans CJK SC",sans-serif;line-break:strict}
[lang=ko]{font-family:system-ui,"Noto Sans KR","Noto Sans CJK KR",sans-serif;word-break:keep-all}
header{background:var(--night);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5}
header h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.02em}
header small{display:block;font-size:12px;opacity:.6;font-weight:400;margin-top:3px}
main{padding:18px 16px 40px;max-width:560px;margin:0 auto}
.ko{font-size:12px;color:var(--sub);margin-top:3px;font-weight:400}

.pick h2{font-size:26px;margin:4px 2px 2px;font-weight:800}
.pick .ko{margin:0 2px 12px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:10px;text-decoration:none;color:inherit;border-left:8px solid}
.prow img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.prow .w{flex:1;min-width:0}
.prow b{display:block;font-size:20px;line-height:1.3}
.prow .to{font-size:14px;color:var(--sub);margin-top:2px}
.prow .arr{font-size:22px;color:var(--sub)}

.card{background:var(--card);border-radius:22px;overflow:hidden;margin-top:26px;scroll-margin-top:84px}
.band{padding:16px 18px 14px;color:#fff}
.band .no{font-size:13px;opacity:.85;letter-spacing:.08em}
.band b{display:block;font-size:28px;line-height:1.25;margin-top:2px;font-weight:800;text-wrap:balance}
.band .ko{color:#fff;opacity:.8}
.photo{background:#fff;padding:14px 18px 0;text-align:center}
.photo img{width:100%;max-height:300px;object-fit:contain;border-radius:14px}
.body{padding:12px 18px 20px}
.name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name b{font-size:24px;font-weight:800}
.tag{font-size:14px;padding:4px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.drug{background:var(--red-bg);color:var(--red)}.herbal{background:var(--teal-bg);color:var(--teal-ink)}.food{background:var(--gray-bg);color:var(--gray)}
.points{list-style:none;margin:16px 0 0;padding:0}
.points li{font-size:21px;font-weight:600;line-height:1.4;padding:9px 0 9px 38px;position:relative;border-top:1px solid var(--line)}
.points li:first-child{border-top:0}
.points li::before{content:"✓";position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.caution{margin-top:14px;background:var(--red-bg);color:var(--red);border-radius:12px;padding:10px 14px;font-size:17px;line-height:1.5}
.caution b{margin-right:6px}
.price{display:flex;align-items:baseline;gap:8px;margin-top:16px;flex-wrap:wrap}
.price .won{font-size:30px;font-weight:800}
.price .cny{font-size:20px;font-weight:700;color:var(--sub)}
.price .unit{font-size:16px;color:var(--sub)}

.c-purple{border-color:var(--purple)}.c-purple .band,.c-purple .points li::before{background:var(--purple)}
.c-teal{border-color:var(--teal)}.c-teal .band,.c-teal .points li::before{background:var(--teal)}
.c-amber{border-color:var(--amber)}.c-amber .band,.c-amber .points li::before{background:var(--amber)}
.top{display:block;text-align:center;margin-top:24px;font-size:16px;color:var(--sub);text-decoration:none}
</style>
</head>
<body>
<header><h1>睡眠好物对比</h1><small lang="ko">수면 제품 비교 · 약사 상담용</small></header>
<main id="app"></main>
<script src="data.js"></script>
<script>
const cat = CATEGORIES[0];
const cny = n => `≈ ¥${Math.round(n / RATE)}`;

const pick = `<section class="pick" id="top"><h2>${cat.intro}</h2><div class="ko" lang="ko">${cat.introKo}</div>
  ${cat.products.map(p => `<a class="prow c-${p.color}" href="#${p.id}"><img src="${p.img}" alt="">
    <div class="w"><b>${p.want}</b><div class="to">→ ${p.zh}</div></div><span class="arr">›</span></a>`).join('')}</section>`;

const cards = cat.products.map((p, i) => `
  <article class="card c-${p.color}" id="${p.id}">
    <div class="band"><div class="no">0${i + 1}</div><b>${p.want}</b><div class="ko" lang="ko">${p.wantKo}</div></div>
    <div class="photo"><img src="${p.img}" alt="${p.zh}"></div>
    <div class="body">
      <div class="name"><b>${p.zh}</b><span class="tag ${p.type}">${p.typeZh}</span></div>
      <div class="ko" lang="ko">${p.ko}</div>
      <ul class="points">${p.points.map(t => `<li>${t}</li>`).join('')}</ul>
      <div class="caution"><b>注意</b>${p.caution.join('<br>')}</div>
      <div class="price"><span class="won">₩${p.price.toLocaleString()}</span><span class="cny">${cny(p.price)}</span><span class="unit">/ ${p.unit}</span></div>
    </div>
  </article>`).join('');

document.getElementById('app').innerHTML = pick + cards + `<a class="top" href="#top">↑ 回到上面</a>`;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
