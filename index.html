<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E1B3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>睡眠好物对比</title>
<style>
:root{--bg:#F6F4EF;--card:#fff;--ink:#1C1B22;--sub:#6B6873;--line:#E4E1DA;--night:#1E1B3A;
--purple-bg:#ECEAFB;--purple:#3C3489;--teal-bg:#DFF3EB;--teal:#085041;--amber-bg:#FBEBD2;--amber:#7A4A06;
--red-bg:#FBE6E6;--red:#8E2323;--gray-bg:#EFEDE6;--gray:#4A4944;--ok:#0F6E56;--no:#9A9890}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans SC","Noto Sans CJK SC",sans-serif}
[lang=ko]{font-family:system-ui,"Noto Sans KR","Noto Sans CJK KR",sans-serif}
header{background:var(--night);color:#fff;padding:14px 16px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;font-weight:700;flex:1}
header small{display:block;font-size:12px;opacity:.65;font-weight:400;margin-top:2px}
.back{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;font-size:22px;width:44px;height:44px;display:none}
.back.on{display:block}
main{padding:16px;max-width:900px;margin:0 auto}
.ko{font-size:12px;color:var(--sub);margin-top:4px}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.need{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 14px;text-align:left;font:inherit;color:inherit;min-height:150px;display:flex;flex-direction:column}
.need .e{font-size:34px}
.need b{font-size:21px;margin-top:10px;line-height:1.25}
.need span{font-size:14px;color:var(--sub);margin-top:4px}
.need .ko{margin-top:auto;padding-top:8px}
.note{background:var(--amber-bg);color:var(--amber);border-radius:14px;padding:14px;font-size:16px;line-height:1.55;margin-bottom:14px}
.note .ko{color:var(--amber);opacity:.8}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:14px;margin-bottom:12px;align-items:center;width:100%;font:inherit;color:inherit;text-align:left}
.pcard img{width:108px;height:108px;object-fit:cover;border-radius:12px;flex:none;background:var(--gray-bg)}
.pcard b{font-size:19px;display:block;line-height:1.3}
.pcard .hook{font-size:14px;color:var(--sub);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:14px;padding:4px 10px;border-radius:99px;font-weight:600}
.purple{background:var(--purple-bg);color:var(--purple)}.teal{background:var(--teal-bg);color:var(--teal)}
.amber{background:var(--amber-bg);color:var(--amber)}.drug{background:var(--red-bg);color:var(--red)}
.herbal{background:var(--teal-bg);color:var(--teal)}.food{background:var(--gray-bg);color:var(--gray)}
.price{font-size:17px;font-weight:700;margin-top:8px}.price small{font-weight:400;color:var(--sub);font-size:13px}
.cmpbtn{width:100%;background:var(--night);color:#fff;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:700;padding:16px;margin-top:4px}
.cmp{display:grid;gap:6px;margin:0 -6px}
.cmp .col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0;word-break:break-all}
.cmp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.cmp .nm{font-size:15px;font-weight:700;margin:8px 0 2px;line-height:1.3;min-height:40px}
.row{border-top:1px solid var(--line);padding:8px 0}
.row .k{font-size:12px;color:var(--sub)}.row .v{font-size:15px;margin-top:2px;line-height:1.35}
.yes{color:var(--ok);font-weight:700}.nope{color:var(--no)}
.hero{width:100%;max-height:52vh;object-fit:contain;background:#fff;border-radius:18px;border:1px solid var(--line)}
.dname{font-size:26px;font-weight:800;margin:14px 0 0;line-height:1.25}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.tile{border-radius:14px;padding:14px;font-size:17px;font-weight:700;line-height:1.3}
.tile small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-bottom:4px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.sec h3{font-size:14px;color:var(--sub);margin:0 0 6px;font-weight:500}
.sec p{font-size:18px;margin:0;line-height:1.5}
.warn{border-color:#EDB9B9}
.warn ul{margin:0;padding-left:20px;font-size:17px;line-height:1.6}
@media (min-width:700px){.needs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <button class="back" id="back" aria-label="返回">‹</button>
  <h1 id="ttl">睡眠好物对比<small lang="ko">수면 제품 안내 · 약사 상담용</small></h1>
</header>
<main id="app"></main>
<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const byId = id => PRODUCTS.find(p => p.id === id);
const won = n => n == null ? '<span lang="ko">가격 미정</span>' : `₩${n.toLocaleString()} <small style="white-space:nowrap;word-break:keep-all">≈ ¥${Math.round(n / RATE)}</small>`;
const tagHtml = p => `<div class="tags"><span class="tag ${p.type}">${p.typeZh}</span>${p.tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('')}</div>`;

function home() {
  return `<div class="needs">${NEEDS.map(n => `
    <button class="need" onclick="go('n/${n.id}')"><span class="e">${{fast:'🌙',weak:'🍃',mela:'💊',all:'📋'}[n.id]}</span>
    <b>${n.zh}</b><span>${n.sub}</span><div class="ko" lang="ko">${n.ko}</div></button>`).join('')}</div>`;
}

function need(id) {
  const n = NEEDS.find(x => x.id === id);
  if (id === 'all') return compare(n.pick);
  const note = n.note ? `<div class="note">${MELA_NOTE.zh}<div class="ko" lang="ko">${MELA_NOTE.ko}</div></div>` : '';
  return note + n.pick.map(pid => {
    const p = byId(pid);
    return `<button class="pcard" onclick="go('p/${p.id}')"><img src="${p.img}" alt="">
      <div><b>${p.zh}</b><div class="ko" lang="ko">${p.ko}</div>${tagHtml(p)}
      <div class="price">${won(p.price)} <small>/ ${p.unit}</small></div></div></button>`;
  }).join('') + `<button class="cmpbtn" onclick="go('n/all')">和其他产品对比 →</button>`;
}

function compare(ids) {
  const ps = ids.map(byId);
  const rows = [
    ['类型', p => `<span class="tag ${p.type}">${p.typeZh}</span>`],
    ['适合', p => p.facts.use],
    ['主要成分', p => p.facts.ingredient],
    ['含褪黑素', p => p.facts.mela ? '<span class="yes">✓ 含</span>' : '<span class="nope">✕ 不含</span>'],
    ['第二天犯困', p => p.facts.drowsy],
    ['剂型', p => p.facts.form],
    ['价格', p => won(p.price)],
  ];
  return `<div class="cmp" style="grid-template-columns:repeat(${ps.length},minmax(0,1fr))">${ps.map(p => `
    <div class="col" onclick="go('p/${p.id}')"><img src="${p.img}" alt=""><div class="nm">${p.zh}</div>
    ${rows.map(([k, f]) => `<div class="row"><div class="k">${k}</div><div class="v">${f(p)}</div></div>`).join('')}</div>`).join('')}</div>`;
}

function detail(id) {
  const p = byId(id), f = p.facts;
  return `<img class="hero" src="${p.img}" alt="">
    <div class="dname">${p.zh}</div><div class="ko" lang="ko">${p.ko}</div>${tagHtml(p)}
    <div class="tiles">
      <div class="tile ${p.type}"><small>类型</small>${f.kind}</div>
      <div class="tile ${f.mela ? 'amber' : 'food'}"><small>褪黑素</small>${f.mela ? '✓ 含' : '✕ 不含'}</div>
      <div class="tile food"><small>剂型</small>${f.form}</div>
      <div class="tile food"><small>第二天犯困</small>${f.drowsy}</div>
    </div>
    <div class="sec"><h3>适合</h3><p>${f.use}</p></div>
    <div class="sec"><h3>怎么吃</h3><p>${p.how}</p></div>
    <div class="sec warn"><h3>注意</h3><ul>${p.cautions.map(c => `<li>${c}</li>`).join('')}</ul></div>
    <div class="sec"><h3>价格</h3><p class="price" style="margin:0">${won(p.price)} <small>/ ${p.unit}</small></p></div>`;
}

function go(h) { location.hash = h; }
function render() {
  const [kind, id] = location.hash.slice(1).split('/');
  const view = kind === 'n' ? need(id) : kind === 'p' ? detail(id) : home();
  $('#app').innerHTML = view;
  $('#back').classList.toggle('on', !!kind);
  scrollTo(0, 0);
}
$('#back').onclick = () => history.back();
addEventListener('hashchange', render);
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
